<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage - iStart Séries TV</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="scriptt.js"></script>
</head>
<body>
    <header>
        <h1>Sondage - iStart Séries TV</h1>
    </header>
    <main>
        <section class="survey">
            <h2>Quel est votre genre de série TV préféré ?</h2>
            <form id="surveyForm">
                <div class="option">
                    <input type="radio" name="genre" id="drama" value="drama">
                    <label for="drama">Drame</label>
                    <span class="percentage">30%</span>
                    <span class="votes">(15 votes)</span>
                </div>
                <div class="option">
                    <input type="radio" name="genre" id="comedy" value="comedy">
                    <label for="comedy">Comédie</label>
                    <span class="percentage">40%</span>
                    <span class="votes">(20 votes)</span>
                </div>
                <div class="option">
                    <input type="radio" name="genre" id="sci-fi" value="sci-fi">
                    <label for="sci-fi">Science-Fiction</label>
                    <span class="percentage">20%</span>
                    <span class="votes">(10 votes)</span>
                </div>
                <div class="option">
                    <input type="radio" name="genre" id="action" value="action">
                    <label for="action">Action</label>
                    <span class="percentage">10%</span>
                    <span class="votes">(5 votes)</span>
                </div>
                <button type="submit">Votez</button>
            </form>
            <div class="leading-result">
                <p>Le genre dominant est : <strong>Comédie</strong> avec 40%</p>
            </div>
            <a href="all-surveys.html">Voir tous les sondages</a>
        </section>
    </main>
</body>
</html>
